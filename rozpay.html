<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shop</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            background-color: #afecda;
            }

        .heading{
            display: flex;
            justify-content: center;
            width:500px;
            background-color: #0d946c;
            color: black;
            margin-left: 33%;
            padding: 20px;
            border-radius: 10px;
            border-style: dotted;
            border-color: #afecda;
        }

        .container{
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            display: flex;
            justify-content: center;
        }

        .card{
            background-color: white;
            width: 250px;
            padding: 15px;
            border-radius:10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            border: 4px solid black;
        }

        .card img{
            width: 100%;
            height: 280px;
            object-fit: cover;
            /* border: 4px solid black; */
        }

        button{
            background-color: #0d946c;
            color: white;
            border: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: large;
            text-decoration:solid;
            color: black;
            padding: 6px;
        }

        .cart{
            margin-top:30px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            flex-wrap: wrap;
            display: flex;
            justify-content: center;
            width: 400px;
            margin-left: 36%;
            border: 4px solid black;
        }

        #payBtn{
            background: rgb(55, 146, 55);
        }

    </style>
</head>
<body>

    <h1 class="heading">My Store</h1>

    <div class="container">
        <div class="card">
            <img src="tshirt.png" alt="">
            <h3>T-Shirt</h3>
            <p><b>500₹</b></p>
            <button onclick="addToCart('T-Shirt',500)">Add To Cart</button>
        </div>

         <div class="card">
            <img src="shoes.png" alt="">
            <h3>Shoes</h3>
            <p><b>1500₹</b></p>
            <button onclick="addToCart('Shoes',1500)">Add To Cart</button>
        </div>

         <div class="card">
            <img src="pant.png" alt="">
            <h3>Pant</h3>
            <p><b>800₹</b></p>
            <button onclick="addToCart('Pant',800)">Add To Cart</button>
        </div>
    </div>

    <div class="cart">
        <div>
        <h2>Cart Items</h2>

        <ul id="cartList"></ul>

        <h3>Total : ₹<span id="total">0</span></h3>

        <button id="payBtn" onclick="payNow()">Buy Now</button>

        </div>
    </div>

    <script>
        let cart =[];
        let total=0;

        function addToCart(name,price){
            cart.push({
                name,
                price
            });

            total +=price;

            document.getElementById("total").innerText=total;

            let li=document.createElement("li");
            li.innerText= `${name} - ${price} ₹`;

            document.getElementById("cartList").appendChild(li);
        }

        function payNow(){
            if(total===0){
                alert("cart is Empty");
                return;
            }

            let options={
                key:"YOUR_ROZPAY_KEY_ID",

                amount:total*100,

                currency:"INR",

                name:"My store",

                description:"product purchase",

                handler:function(response){
                    alert(
                        "Payment Successful\nPayment ID : "+
                        response.razopay_payment_id
                    );

                    console.log(response);

                    cart=[];
                    total=0;

                    document.getElementById("cartList").innerHTML="";
                    document.getElementById("total").innerText="0";
                },

                theme:{
                    color:"#0d6efd"
                }
            };

            let rzp = new Razorpay(options);
            rzp.open();
        }
    </script>
    

</body>
</html>
